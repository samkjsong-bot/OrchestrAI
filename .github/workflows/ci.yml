name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

concurrency:
  group: orchestrai-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 모든 javascript actions 를 Node 24 로 강제 (Node 20 deprecation 우회)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Validate the incoming ubuntu-latest image before its rollout.
        # https://github.com/actions/runner-images/issues/14748
        os: [ubuntu-latest, windows-latest, ubuntu-26.04]
        node: ['20.x']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (esbuild bundle)
        run: npm run build

      - name: Test
        run: npm test

      - name: Package vsix (no publish, sanity check)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          npm prune --omit=dev
          npx vsce package --allow-missing-repository -o orchestrai-ci.vsix
          ls -la orchestrai-ci.vsix

      - name: Upload vsix artifact
        if: startsWith(matrix.os, 'ubuntu-') && github.event_name != 'push'
        uses: actions/upload-artifact@v5
        with:
          # Keep the existing artifact contract; isolate the 26.04 comparison.
          name: orchestrai-vsix-${{ github.sha }}${{ matrix.os == 'ubuntu-26.04' && '-ubuntu-26.04' || '' }}
          path: orchestrai-ci.vsix
          retention-days: 3
